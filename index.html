<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard -SaturnPedia</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      color: #fff;
    }

    .box {
      text-align: center;
      padding: 40px 25px;
      width: 90%;
      max-width: 400px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    a {
      display: block;
      padding: 15px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    a:hover {
      transform: scale(1.02);
    }

    .footer {
      margin-top: 25px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="logo">SP</div>

    <h1>Order SaturnPedia</h1>

    <p>
      Ingin melakukan order?<br>
      Klik tombol di bawah untuk melanjutkan ke website SaturnPedia.
    </p>

    <a href="https://www.saturnpedia.id">
      Order? Klik di sini
    </a>

    <div class="footer">
      © 2026 SaturnPedia
    </div>
  </div>

</body>
</html>
